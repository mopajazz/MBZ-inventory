<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBZ to Canvas Readiness</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="upload-panel" aria-labelledby="app-title">
      <div>
        <p class="eyebrow">Moodle backup review</p>
        <h1 id="app-title">Canvas migration readiness</h1>
        <p class="intro">
          Upload a Moodle .mbz backup to inspect course items and flag likely Canvas migration risks before planning the move.
        </p>
      </div>

      <label class="drop-zone" for="mbz-file">
        <span class="drop-title">Choose a Moodle .mbz file</span>
        <span class="drop-copy">The backup is read in your browser for inventory review. No clean backup is generated.</span>
        <input id="mbz-file" type="file" accept=".mbz,.zip,.tgz,.tar.gz,application/zip,application/gzip">
      </label>

      <p id="status" class="status" role="status">Waiting for an upload.</p>
    </section>

    <section id="results" class="results is-empty" aria-live="polite">
      <div class="summary-grid" aria-label="Course inventory summary">
        <article class="summary-card">
          <span class="summary-label">Total</span>
          <strong id="count-total">0</strong>
        </article>
        <article class="summary-card critical">
          <span class="summary-label">Critical</span>
          <strong id="count-critical">0</strong>
        </article>
        <article class="summary-card high">
          <span class="summary-label">High</span>
          <strong id="count-high">0</strong>
        </article>
        <article class="summary-card medium">
          <span class="summary-label">Medium</span>
          <strong id="count-medium">0</strong>
        </article>
        <article class="summary-card low">
          <span class="summary-label">Low</span>
          <strong id="count-low">0</strong>
        </article>
      </div>

      <div id="inventory" class="inventory"></div>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
